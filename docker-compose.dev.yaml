services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports: !override
      - "${WEB_PORT:-8080}:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  web_node_modules:
