services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oa_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-oa_workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oa_workbench_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oa_workbench} -d ${POSTGRES_DB:-oa_workbench}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-oa_workbench}:${POSTGRES_PASSWORD:-oa_workbench_change_me}@postgres:5432/${POSTGRES_DB:-oa_workbench}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/uploads
    volumes:
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:
