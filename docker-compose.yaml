services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-middle_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-middle_workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-middle_workbench_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-middle_workbench} -d ${POSTGRES_DB:-middle_workbench}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: middle-platform-api:latest
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-middle_workbench}:${POSTGRES_PASSWORD:-middle_workbench_change_me}@postgres:5432/${POSTGRES_DB:-middle_workbench}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-secret}
      MODEL_PROVIDER_ENCRYPTION_KEY: ${MODEL_PROVIDER_ENCRYPTION_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLED_MODULES: ${ENABLED_MODULES:-video-search}
      MODULES_DIR: /app/src/modules
      UPLOAD_DIR: /app/uploads
      PANSOU_BASE_URL: ${PANSOU_BASE_URL:-https://pansou.top}
      VIDEO_SEARCH_TIMEOUT_MS: ${VIDEO_SEARCH_TIMEOUT_MS:-30000}
      VIDEO_SEARCH_MAX_RESULTS: ${VIDEO_SEARCH_MAX_RESULTS:-100}
      VIDEO_SEARCH_RESOLVE_CACHE_TTL_MS: ${VIDEO_SEARCH_RESOLVE_CACHE_TTL_MS:-300000}
      DOUBAN_BASE_URL: ${DOUBAN_BASE_URL:-https://m.douban.com}
      DOUBAN_MOVIE_COLLECTION: ${DOUBAN_MOVIE_COLLECTION:-movie_top250}
      DOUBAN_TV_COLLECTION: ${DOUBAN_TV_COLLECTION:-tv_hot}
      DOUBAN_TIMEOUT_MS: ${DOUBAN_TIMEOUT_MS:-12000}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_TIMEOUT_MS: ${TMDB_TIMEOUT_MS:-12000}
      MEDIA_LIBRARY_SYNC_LIMIT: ${MEDIA_LIBRARY_SYNC_LIMIT:-250}
      MEDIA_LIBRARY_PROGRESS_SYNC_INTERVAL_MS: ${MEDIA_LIBRARY_PROGRESS_SYNC_INTERVAL_MS:-21600000}
      BAOFENG_PLAYABLE_ENABLED: ${BAOFENG_PLAYABLE_ENABLED:-true}
      BAOFENG_API_URL: ${BAOFENG_API_URL:-https://bfzyapi.com/api.php/provide/vod/}
      BAOFENG_TIMEOUT_MS: ${BAOFENG_TIMEOUT_MS:-12000}
      YZY1080_PLAYABLE_ENABLED: ${YZY1080_PLAYABLE_ENABLED:-true}
      YZY1080_API_URL: ${YZY1080_API_URL:-https://api.yyzy-tv.vip/inc/apijson.php}
      YZY1080_TIMEOUT_MS: ${YZY1080_TIMEOUT_MS:-12000}
      XINLANG_PLAYABLE_ENABLED: ${XINLANG_PLAYABLE_ENABLED:-true}
      XINLANG_API_URL: ${XINLANG_API_URL:-https://api.xinlangapi.com/xinlangapi.php/provide/vod/from/xlm3u8/}
      XINLANG_TIMEOUT_MS: ${XINLANG_TIMEOUT_MS:-12000}
      NIUNIU_PLAYABLE_ENABLED: ${NIUNIU_PLAYABLE_ENABLED:-true}
      NIUNIU_SITE_URL: ${NIUNIU_SITE_URL:-https://niuniuzy4.com}
      NIUNIU_API_URL: ${NIUNIU_API_URL:-https://api.niuniuzy.me/api.php/provide/vod/from/nnm3u8/at/json}
      NIUNIU_TIMEOUT_MS: ${NIUNIU_TIMEOUT_MS:-12000}
      FEIFAN_PLAYABLE_ENABLED: ${FEIFAN_PLAYABLE_ENABLED:-true}
      FEIFAN_API_URL: ${FEIFAN_API_URL:-https://ffzy5.tv/api.php/provide/vod/}
      FEIFAN_TIMEOUT_MS: ${FEIFAN_TIMEOUT_MS:-12000}
      ZY360_PLAYABLE_ENABLED: ${ZY360_PLAYABLE_ENABLED:-true}
      ZY360_API_URL: ${ZY360_API_URL:-https://360zyzz.com/api.php/provide/vod/}
      ZY360_TIMEOUT_MS: ${ZY360_TIMEOUT_MS:-12000}
    volumes:
      - ./server/src:/app/src:ro
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: middle-platform-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    restart: unless-stopped
    command: sh /app/scripts/start-web-dev.sh
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-8088}:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:
  web_node_modules:
