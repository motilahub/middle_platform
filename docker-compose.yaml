services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-middle_workbench}
      POSTGRES_USER: ${POSTGRES_USER:-middle_workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-middle_workbench_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-middle_workbench} -d ${POSTGRES_DB:-middle_workbench}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: middle-platform-api:latest
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-middle_workbench}:${POSTGRES_PASSWORD:-middle_workbench_change_me}@postgres:5432/${POSTGRES_DB:-middle_workbench}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./server/src:/app/src:ro
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: middle-platform-web:latest
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-8088}:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:
  web_node_modules:
